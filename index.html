<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Missing Positive Number</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f9f9f9; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 450px; }
        input { padding: 10px; width: 100%; box-sizing: border-box; margin-top: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; font-size: 16px; color: #28a745; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Smallest Missing Positive Number</h2>
        <p>Enter numbers separated by spaces (e.g., <code>1 2 0 -1</code>):</p>
        
        <input type="text" id="userInput" placeholder="1 2 0 -1">
        <button onclick="findMissingNumber()">Calculate</button>
        
        <div id="result"></div>
    </div>

    <script>
        function findMissingNumber() {
            const input = document.getElementById('userInput').value;
            const nums = input.trim().split(/\s+/).map(Number);
            
            let number = 1;
            while (nums.includes(number)) {
                number++;
            }
            
            document.getElementById('result').innerText = `The smallest missing positive number is: ${number}`;
        }
    </script>

</body>
</html>
